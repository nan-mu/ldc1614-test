# config.yml

# CSV配置
csv:
  # path不填写时，会在运行文件夹下创建一个data_<时间>.csv文件
  path: "data.csv"

# Redis配置
# redis:
#   # TODO: 完善redis细致配置
#   url: "redis://:mypassword@127.0.0.1:6379"

# 任务列表
tasks:
  - registers:
      - field: "rcount"
        value: 1160                # 原值: 0x0488
      - field: "offset"
        value: 0                   # 原值: 0
      - field: "settlecount"
        value: 90                  # 原值: 0x5a
      - field: "fin_divider"
        value: 1                   # 原值: 0b1
      - field: "fref_divider"
        value: 2                   # 原值: 0b10
      - field: "deglitch"
        value: 1                   # 原值: 0b001
      - field: "LC_sensor_drive_current"
        value: 31                  # 原值: 0b11111
    channel: 2
    count: 100
    location: "0:50" # 毫米
