# config.yml

# CSV配置
# csv:
#   # path不填写时，会在运行文件夹下创建一个data_<时间>.csv文件
#   path: "/path/to/csv/file.csv"

# Redis配置
redis:
  # TODO: 完善redis细致配置
  url: "redis://:mypassword@127.0.0.1:6379"

# 任务列表
tasks:
  - registers:
      - field: "rcount"
        value: 0x0488
      - field: "offset"
        value: 0
      - field: "settlecount"
        value: 0x5a
      - field: "fin_divider"
        value: 0b1
      - field: "fref_divider"
        value: 0b10
      - field: "rr_sequence"
        value: 1
      - field: "deglitch"
        value: 0b001
      - field: "idrive"
        value: 0b11111
    channel: 2
    count: 10
    location: "0:100:200" // 毫米
